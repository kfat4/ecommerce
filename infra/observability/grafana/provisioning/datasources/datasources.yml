apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      # Micrometer attaches the trace id of a sampled request to histogram buckets (exemplars).
      # Clicking such a dot on a latency panel opens exactly that slow request in Kibana APM.
      exemplarTraceIdDestinations:
        - name: trace_id
          url: http://localhost:5601/app/apm/link-to/trace/$${__value.raw}
          urlDisplayLabel: Kibana APM'de aç

  - name: Elasticsearch Logs
    uid: es-logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: logs-*
      timeField: "@timestamp"
      logMessageField: body.text
      logLevelField: severity_text
      dataLinks:
        - field: trace_id
          url: http://localhost:5601/app/apm/link-to/trace/$${__value.raw}
          urlDisplayLabel: Trace'i Kibana APM'de aç
