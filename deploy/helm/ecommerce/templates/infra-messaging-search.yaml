{{- $infra := .Values.infra }}
# ------------------------------------------------------------------------------------------- Kafka (KRaft)
apiVersion: v1
kind: Service
metadata:
  name: kafka
  labels:
    {{- include "ecommerce.labels" (dict "name" "kafka" "component" "broker") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ecommerce.selector" (dict "name" "kafka") | nindent 4 }}
  ports:
    - { name: client, port: 9092 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    {{- include "ecommerce.labels" (dict "name" "kafka" "component" "broker") | nindent 4 }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      {{- include "ecommerce.selector" (dict "name" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecommerce.labels" (dict "name" "kafka" "component" "broker") | nindent 8 }}
    spec:
      # Critical for this image: it turns every KAFKA_* env var into a broker setting, and service links
      # would inject KAFKA_PORT=tcp://... for the `kafka` Service.
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000                        # the image runs as appuser (uid 1000); it must own the volume
      containers:
        - name: kafka
          image: {{ $infra.kafka.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_LOG_DIRS, value: "/var/lib/kafka/data" }
            - { name: KAFKA_HEAP_OPTS, value: {{ $infra.kafka.heap | quote }} }
          ports:
            - { name: client, containerPort: 9092 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ $infra.kafka.storage }} } }
---
# ------------------------------------------------------------------------------------------- Elasticsearch
apiVersion: v1
kind: Service
metadata:
  name: elasticsearch
  labels:
    {{- include "ecommerce.labels" (dict "name" "elasticsearch" "component" "search") | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "ecommerce.selector" (dict "name" "elasticsearch") | nindent 4 }}
  ports:
    - { name: http, port: 9200 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: elasticsearch
  labels:
    {{- include "ecommerce.labels" (dict "name" "elasticsearch" "component" "search") | nindent 4 }}
spec:
  serviceName: elasticsearch
  replicas: 1
  selector:
    matchLabels:
      {{- include "ecommerce.selector" (dict "name" "elasticsearch") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecommerce.labels" (dict "name" "elasticsearch" "component" "search") | nindent 8 }}
    spec:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
      containers:
        - name: elasticsearch
          image: {{ $infra.elasticsearch.image }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: discovery.type, value: single-node }
            - { name: xpack.security.enabled, value: "false" }       # local only; production: TLS + API keys
            - { name: action.auto_create_index, value: "+logs-*,+traces-*,+metrics-*,+.*,-*" }
            - { name: ES_JAVA_OPTS, value: {{ $infra.elasticsearch.heap | quote }} }
          ports:
            - { name: http, containerPort: 9200 }
          readinessProbe:
            httpGet: { path: "/_cluster/health?local=true", port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits: { memory: 1280Mi }
          volumeMounts:
            - { name: data, mountPath: /usr/share/elasticsearch/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ $infra.elasticsearch.storage }} } }
---
# ------------------------------------------------------------------------------------------- payment provider (WireMock)
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-provider-mappings
  labels:
    {{- include "ecommerce.labels" (dict "name" "payment-provider" "component" "external-stub") | nindent 4 }}
data:
  {{- (.Files.Glob "files/wiremock-mappings/*.json").AsConfig | nindent 2 }}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-provider
  labels:
    {{- include "ecommerce.labels" (dict "name" "payment-provider" "component" "external-stub") | nindent 4 }}
spec:
  selector:
    {{- include "ecommerce.selector" (dict "name" "payment-provider") | nindent 4 }}
  ports:
    - { name: http, port: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-provider
  labels:
    {{- include "ecommerce.labels" (dict "name" "payment-provider" "component" "external-stub") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "ecommerce.selector" (dict "name" "payment-provider") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecommerce.labels" (dict "name" "payment-provider" "component" "external-stub") | nindent 8 }}
    spec:
      enableServiceLinks: false
      containers:
        - name: wiremock
          image: {{ $infra.paymentProvider.image }}
          imagePullPolicy: IfNotPresent
          args: ["--global-response-templating", "--disable-banner"]
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /__admin/health, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: mappings, mountPath: /home/wiremock/mappings, readOnly: true }
      volumes:
        - name: mappings
          configMap: { name: payment-provider-mappings }
