# Values for a local single-node cluster (Docker Desktop Kubernetes).
# Another environment gets its own values file (values-staging.yaml, ...) instead of edits here.

image:
  registry: ecommerce          # images built by `docker compose build` (ecommerce/<service>:local)
  tag: local
  # Never: the cluster shares Docker Desktop's image store, so nothing is pulled. A missing image fails
  # loudly (ErrImageNeverPull) instead of silently trying Docker Hub.
  pullPolicy: Never

# Development credentials only. They match the compose defaults and live in a Kubernetes Secret.
# A real environment injects them from a secret store (External Secrets, Vault) – never from this file.
secrets:
  jwtSecret: local-dev-secret-change-me-0123456789abcdef
  postgresUser: ecommerce
  postgresPassword: ecommerce

# Logs and traces go to an OTel collector. There is none in this chart yet, so export is off.
observability:
  otlpEndpoint: ""             # e.g. http://otel-collector:4318 once a collector is deployed
  tracingSampling: "1.0"

# Defaults for every Spring Boot service; each entry under `services` can override them.
serviceDefaults:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 448Mi }
    # Heap is 50% of the limit (MaxRAMPercentage in the Dockerfile). The other half is for metaspace, threads
    # and buffers: with 75% of 512Mi the pods were OOMKilled under load.
    limits: { memory: 640Mi }  # no CPU limit: throttling makes JVM start-up very slow
  # The app opens its port only after Flyway, Kafka topics etc. are ready, so give it time.
  startupProbe: { failureThreshold: 36, periodSeconds: 5 }

services:
  api-gateway:
    port: 8080
    serviceType: LoadBalancer  # Docker Desktop publishes LoadBalancer services on localhost
    waitFor: ["redis:6379"]
  auth-service:
    port: 8086
    waitFor: ["postgres:5432", "redis:6379", "kafka:9092"]
  product-service:
    port: 8081
    waitFor: ["mongo:27017", "redis:6379", "kafka:9092"]
  inventory-service:
    port: 8083
    waitFor: ["postgres:5432", "redis:6379", "kafka:9092"]
  order-service:
    port: 8082
    waitFor: ["postgres:5432", "redis:6379", "kafka:9092"]
  payment-service:
    port: 8084
    waitFor: ["postgres:5432", "redis:6379", "kafka:9092", "payment-provider:8080"]
    env:
      PAYMENT_PROVIDER_URL: http://payment-provider:8080
  notification-service:
    port: 8085
    waitFor: ["mongo:27017", "redis:6379", "kafka:9092"]
  search-service:
    port: 8087
    waitFor: ["elasticsearch:9200", "redis:6379", "kafka:9092"]

# Infrastructure. In production these are managed services (RDS, MSK, Atlas, Elastic Cloud) or run by
# operators; here they are plain StatefulSets so the whole system starts with one command.
infra:
  waitImage: busybox:1.37.0
  postgres:
    image: postgres:17-alpine
    storage: 1Gi
  mongo:
    image: mongo:7.0
    storage: 1Gi
  redis:
    image: redis:7.4-alpine
  kafka:
    image: apache/kafka:4.3.2
    storage: 2Gi
    heap: -Xms384m -Xmx384m
  elasticsearch:
    image: elasticsearch:9.2.8
    storage: 2Gi
    heap: -Xms512m -Xmx512m
  paymentProvider:
    image: wiremock/wiremock:3.13.2

# Web UIs for looking at the live data (templates/dev-tools.yaml). Same images and localhost ports as compose.
# None of them has a login, so they are ClusterIP only: Docker Desktop binds LoadBalancer ports on all network
# interfaces (*:8080), which would publish them to the LAN. `make k8s-ui` port-forwards them to 127.0.0.1.
# A shared or production cluster sets enabled: false.
devTools:
  enabled: true
  kafkaUi:
    image: kafbat/kafka-ui:v1.5.0
    port: 8090
  pgadmin:
    image: dpage/pgadmin4:9.19.0
    port: 5050
  mongoExpress:
    image: mongo-express:1.0.2-20-alpine3.19   # unmaintained since 2024: local use only
    port: 8091
  redisinsight:
    image: redis/redisinsight:3.8.0
    port: 5540
