# ---------------------------------------------------------------------------------------------
# Platform defaults shared by every servlet service. Imported with:
#   spring.config.import: classpath:ecommerce-common.yml
# Everything is overridable through environment variables (12-factor app, config in the environment).
# ---------------------------------------------------------------------------------------------
server:
  shutdown: graceful                      # finish in-flight requests before the container stops

spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true                       # Java 21+ virtual threads for request handling & listeners
  jpa:
    open-in-view: false                   # no lazy loading in the web layer -> no hidden N+1 / long DB connections
    hibernate:
      ddl-auto: validate                  # schema is owned by Flyway, Hibernate only validates
  datasource:
    username: ${POSTGRES_USER:ecommerce}
    password: ${POSTGRES_PASSWORD:ecommerce}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      acks: all                           # wait for all in-sync replicas
      properties:
        enable.idempotence: true          # broker de-duplicates producer retries (no duplicates caused by retries)
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000
        linger.ms: 5
    consumer:
      group-id: ${spring.application.name}  # all replicas share one group -> partitions are split between them
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        isolation.level: read_committed
    listener:
      ack-mode: record                    # offset committed after the record was processed successfully
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:1}
      observation-enabled: true           # trace context propagates through Kafka headers
    template:
      observation-enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true               # containers register with their own IP -> each replica is addressable
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# management.* (actuator, tracing, OTLP logs, metrics) defaults live in observability-lib:
#   ecommerce-observability-defaults.yml

ecommerce:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: ecommerce-auth
      access-token-ttl: 30m
