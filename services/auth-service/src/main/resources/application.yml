server:
  port: 8086

spring:
  application:
    name: auth-service
  config:
    import: classpath:ecommerce-common.yml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/auth_db

ecommerce:
  security:
    jwt:
      public-paths:
        - /api/v1/auth/register
        - /api/v1/auth/login
