server:
  port: 8082

spring:
  application:
    name: order-service
  config:
    import: classpath:ecommerce-common.yml
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/order_db
  http:
    clients:
      connect-timeout: 1s     # fail fast when a replica is gone
      read-timeout: 2s        # upper bound for a healthy response, then retry/circuit breaker take over

ecommerce:
  outbox:
    enabled: true
  inbox:
    enabled: true
  idempotency:
    enabled: true
    paths:
      - /api/v1/orders
    ttl: 24h
  saga:
    step-timeout: 30s
    max-payment-retries: 3

resilience4j:
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 200ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException      # I/O errors, timeouts
          - org.springframework.web.client.HttpServerErrorException     # 5xx
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException     # 4xx: retrying will not help
  circuitbreaker:
    instances:
      productService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 1500ms
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - org.springframework.web.client.HttpClientErrorException
  bulkhead:
    instances:
      productService:
        max-concurrent-calls: 25
        max-wait-duration: 100ms

management:
  health:
    circuitbreakers:
      enabled: true
