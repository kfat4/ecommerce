server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # Single standalone registry for local/dev. In production run 2-3 peers (or use Kubernetes DNS instead).
    register-with-eureka: false
    fetch-registry: false
  server:
    # Faster eviction so scaled-down replicas disappear quickly in demos.
    eviction-interval-timer-in-ms: 5000
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # scraped statically by Prometheus (it is not in its own registry)
