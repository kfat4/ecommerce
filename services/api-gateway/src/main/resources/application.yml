server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: api-gateway
  lifecycle:
    timeout-per-shutdown-phase: 20s
  reactor:
    context-propagation: auto           # trace context (and MDC) follows the request across reactor threads
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000       # ms – fail fast if a replica is unreachable
            response-timeout: 10s       # never wait forever on a downstream call
          discovery:
            locator:
              enabled: false            # explicit routes only (see RoutesConfig)

ecommerce:
  security:
    jwt:
      secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
      issuer: ecommerce-auth

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 10

# Tracing / OTLP / metric defaults come from observability-lib (ecommerce-observability-defaults.yml).
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
